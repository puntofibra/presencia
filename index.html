<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presencia</title>
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Quién está en casa, en tiempo real">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presencia">
<style>
  :root {
    --bg: #0b1020; --panel: #141b31; --panel2: #1a2340; --txt: #e8ecf8; --mut: #8a94b5;
    --ok: #2ee59d; --bad: #ff6b81; --acc: #6ea8ff; --line: #24304f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 600px at 20% -10%, #18244a 0%, var(--bg) 60%); color: var(--txt);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  .wrap { max-width: 820px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .3px; }
  h1 span { color: var(--acc); }
  .meta { color: var(--mut); font-size: 12px; text-align: right; }
  button { background: var(--panel2); color: var(--txt); border: 1px solid var(--line); border-radius: 10px;
           padding: 8px 12px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .card { background: linear-gradient(180deg, var(--panel), var(--panel2)); border: 1px solid var(--line);
          border-radius: 18px; padding: 18px; position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); }
  .card.in { --c: var(--ok); } .card.out { --c: var(--bad); }
  .name { font-size: 15px; color: var(--mut); margin-bottom: 10px; }
  .state { font-size: 30px; font-weight: 800; display: flex; align-items: center; gap: 10px; color: var(--c); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 0 var(--c); }
  .in .dot { animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46,229,157,.6); } 70% { box-shadow: 0 0 0 12px rgba(46,229,157,0); } 100% { box-shadow: 0 0 0 0 rgba(46,229,157,0); } }
  .since { margin-top: 10px; font-size: 13px; color: var(--mut); }
  .since b { color: var(--txt); font-weight: 600; }
  h2 { font-size: 15px; color: var(--mut); font-weight: 600; margin: 28px 0 10px; text-transform: uppercase; letter-spacing: 1px; }
  .log { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row:last-child { border-bottom: 0; }
  .row small { color: var(--mut); display: block; margin-top: 2px; }
  .tag { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .tag.entra { background: rgba(46,229,157,.14); color: var(--ok); }
  .tag.sale { background: rgba(255,107,129,.14); color: var(--bad); }
  .empty, .err { padding: 18px; color: var(--mut); text-align: center; font-size: 14px; }
  .err { color: var(--bad); }
  .login { max-width: 360px; margin: 18vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px; text-align: center; }
  .login input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--txt); font-size: 16px; margin: 14px 0; }
  .login button { width: 100%; background: var(--acc); color: #06122b; font-weight: 700; border: 0; padding: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login" class="login" hidden>
    <h1>🏠 <span>Presencia</span></h1>
    <p style="color:var(--mut);font-size:14px;margin:8px 0 0">Introduce la clave para ver quién está en casa.</p>
    <input id="clave" type="password" placeholder="Clave" autocomplete="current-password">
    <button id="entrar">Entrar</button>
    <div id="loginErr" class="err" style="padding:10px 0 0"></div>
  </div>

  <div id="app" hidden>
    <header>
      <h1>🏠 <span>Presencia</span></h1>
      <div class="meta">
        <div id="upd">Cargando…</div>
        <button id="salir" style="margin-top:6px">Cerrar sesión</button>
      </div>
    </header>

    <div id="cards" class="cards"></div>

    <h2>Historial</h2>
    <div id="log" class="log"></div>
  </div>

</div>

<script>
// URL de tu Apps Script (la clave NO va aqui: se pide al abrir la web)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxShPBsIK4Qj7NNfO3hmjZRm8SH3WlAu6Wt8ky4EU8loZIqKVUkk8U1bBKQ3_Vrg-PC4w/exec";
const REFRESCO_MS = 15000;

const $ = id => document.getElementById(id);
let timer = null;

function getClave() { try { return localStorage.getItem("presencia_clave") || ""; } catch (e) { return ""; } }
function setClave(v) { try { v ? localStorage.setItem("presencia_clave", v) : localStorage.removeItem("presencia_clave"); } catch (e) {} }

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// "30/09/2026 02:06:56" -> Date
function parseFecha(t) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})/.exec(String(t).trim());
  if (!m) return null;
  return new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], +m[6]);
}

function hace(fecha) {
  if (!fecha) return "";
  let s = Math.max(0, Math.floor((Date.now() - fecha.getTime()) / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60);
  if (d > 0) return d + " d " + h + " h";
  if (h > 0) return h + " h " + m + " min";
  if (m > 0) return m + " min";
  return "unos segundos";
}

async function cargar() {
  const clave = getClave();
  if (!clave) { mostrarLogin(); return; }
  try {
    const r = await fetch(SCRIPT_URL + "?accion=datos&clave=" + encodeURIComponent(clave));
    const j = await r.json();
    if (j.error) {
      setClave("");
      mostrarLogin(j.error === "clave incorrecta" ? "Clave incorrecta" : j.error);
      return;
    }
    mostrarApp(j);
  } catch (e) {
    $("upd").textContent = "Sin conexión, reintentando…";
  }
}

function mostrarLogin(msg) {
  clearInterval(timer);
  $("app").hidden = true;
  $("login").hidden = false;
  $("loginErr").textContent = msg || "";
}

function mostrarApp(j) {
  $("login").hidden = true;
  $("app").hidden = false;

  // Tarjetas
  const estados = j.estado || [];
  $("cards").innerHTML = estados.length ? estados.map(f => {
    const enCasa = String(f[1]).toUpperCase() === "EN CASA";
    const fecha = parseFecha(f[2]);
    return '<div class="card ' + (enCasa ? "in" : "out") + '">' +
      '<div class="name">📱 ' + esc(f[0]) + '</div>' +
      '<div class="state"><span class="dot"></span>' + (enCasa ? "EN CASA" : "FUERA") + '</div>' +
      '<div class="since">Desde <b>' + esc(f[2]) + '</b>' + (fecha ? '<br>Hace <b>' + hace(fecha) + '</b>' : "") + '</div>' +
      '</div>';
  }).join("") : '<div class="empty">Aún no hay móviles registrados.</div>';

  // Historial
  const reg = j.registro || [];
  $("log").innerHTML = reg.length ? reg.map(f => {
    const entra = String(f[2]).toUpperCase() === "ENTRA";
    return '<div class="row"><div>' + esc(f[1]) + '<small>' + esc(f[0]) + '</small></div>' +
      '<span class="tag ' + (entra ? "entra" : "sale") + '">' + (entra ? "ENTRA" : "SALE") + '</span></div>';
  }).join("") : '<div class="empty">Sin movimientos todavía.</div>';

  $("upd").textContent = "Actualizado " + new Date().toLocaleTimeString("es-ES");
}

$("entrar").onclick = () => {
  const v = $("clave").value.trim();
  if (!v) return;
  setClave(v);
  $("clave").value = "";
  cargar().then(() => {
    clearInterval(timer);
    timer = setInterval(cargar, REFRESCO_MS);
  });
};
$("clave").addEventListener("keydown", e => { if (e.key === "Enter") $("entrar").click(); });
$("salir").onclick = () => { setClave(""); mostrarLogin(); };

if (getClave()) { cargar(); timer = setInterval(cargar, REFRESCO_MS); } else { mostrarLogin(); }

// PWA: registro del service worker
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {});
  });
}
</script>
</body>
</html>
